name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project when absent
        run: if [ ! -d android ]; then CI=1 npx expo prebuild --platform android; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: mkdir -p artifacts && cp android/app/build/outputs/apk/release/app-release.apk artifacts/CrashScope-debuggable-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashScope-APK
          path: artifacts/CrashScope-debuggable-release.apk
          if-no-files-found: error
